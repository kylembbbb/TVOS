name: Build TVOS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Android SDK Environment
        run: |
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          yes | sdkmanager --sdk_root=$HOME/android-sdk --licenses || true
          sdkmanager --sdk_root=$HOME/android-sdk "platforms;android-34" "build-tools;34.0.0"

      - name: Make build script executable and compile
        run: |
          cd halo
          chmod +x build.sh
          bash build.sh

      - name: Upload Compiled APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HaloHome-APK
          path: halo/build/HaloHome.apk
